syntax = "proto3";

// Sealed-sender wire envelope. Everything that used to be plaintext routing
// metadata (to_username, client_timestamp, sender_pubkey) now lives INSIDE
// the encrypted, length-padded InnerMessage (see messages.proto), so the
// relay observes only a version tag and an opaque, bucket-sized ciphertext.
message Envelope {
  uint32 version    = 1;   // start at 1; also bound into the AEAD AAD
  bytes  nonce      = 6;   // AES-256-GCM nonce (12 bytes)
  bytes  ciphertext = 7;   // AEAD ciphertext||tag of the framed, padded InnerMessage

  // Retired plaintext-metadata fields. Reserved so the numbers can never be
  // reused for something that would accidentally leak metadata again.
  reserved 2, 3, 4, 5;
  reserved "to_username", "sender_pubkey", "payload_e2e", "client_timestamp";
}
